# Local development only. No hosted project is linked by this file.
project_id = "weave-db-core"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Reference-event fixtures must be created through the API (§15.3).
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Private evidence bucket and signed-URL authorization come with migrations.

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = true

[auth.email]
enabled = false

[auth.sms]
enabled = false

# Google client IDs/secrets require the API/mobile auth setup. Do not commit
# credentials or enable a provider with placeholder credentials.
[auth.external.google]
enabled = false
